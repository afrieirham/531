<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>5/3/1 Calculator</title>
    <meta
      name="description"
      content="Turn four Training Maxes into a full 5/3/1 cycle."
    />
    <meta
      name="theme-color"
      content="#f1f5f9"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0b1220"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/icon-192.png" />
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>5/3/1 Calculator</h1>
      <p class="tagline">One cycle, four exercises, every weight.</p>
    </header>

    <div class="settings">
      <label class="settings-field" for="tm-percent">
        <span class="settings-label">Training Max</span>
        <span class="tm-input">
          <input
            id="tm-percent"
            class="tm-percent"
            type="number"
            inputmode="decimal"
            min="1"
            max="100"
            step="1"
            value="85"
          />
          <span class="tm-input-suffix">% of 1RM</span>
        </span>
      </label>
    </div>

    <div
      class="settings settings-week"
      role="radiogroup"
      aria-label="Current week"
    >
      <span class="settings-label">Week</span>
      <label class="segment">
        <input type="radio" name="week" value="1" aria-label="Week 1, 5s" checked />
        <span>1</span>
      </label>
      <label class="segment">
        <input type="radio" name="week" value="2" aria-label="Week 2, 3s" />
        <span>2</span>
      </label>
      <label class="segment">
        <input type="radio" name="week" value="3" aria-label="Week 3, 5/3/1" />
        <span>3</span>
      </label>
      <label class="segment">
        <input type="radio" name="week" value="4" aria-label="Week 4, deload" />
        <span>4</span>
      </label>
    </div>

    <main id="cards" class="cards" aria-label="Exercises"></main>

    <template id="card-template">
      <section class="card">
        <div class="card-inputs">
          <label class="field">
            <span class="field-label">Exercise</span>
            <input
              class="exercise"
              type="text"
              autocomplete="off"
              spellcheck="false"
            />
          </label>
          <label class="field field-1rm">
            <span class="field-label">1RM (kg)</span>
            <input
              class="one-rm"
              type="number"
              inputmode="decimal"
              min="0"
              step="2.5"
              placeholder="0"
            />
          </label>
        </div>
        <div class="results" aria-live="polite" hidden></div>
      </section>
    </template>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
